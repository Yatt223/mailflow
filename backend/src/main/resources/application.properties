spring.application.name=mailflow-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/mailflow
spring.datasource.username=mailflow
spring.datasource.password=mailflow

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
server.error.include-message=always

# Secrets et réglages locaux : fichier ignoré par Git
spring.config.import=optional:classpath:application-secret.properties

mailflow.jwt.secret=${JWT_SECRET:}
mailflow.jwt.expiration-minutes=60
mailflow.crypto.cle=${MAILFLOW_CRYPTO_KEY:}
mailflow.mail.dev=false
mailflow.mail.intervalle-synchro-ms=60000

mailflow.stockage.dossier=${user.home}/mailflow-data/fichiers
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB